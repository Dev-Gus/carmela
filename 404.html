<style>
  :root{
    --cream:#F7F1E7;
    --rust:#B0562E;
    --rust-dark:#7A3A1D;
    --coffee:#3B2A1E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Work Sans',sans-serif;
    background:var(--cream);
    color:var(--coffee);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .font-display{font-family:'Fraunces',serif;}
  .logo{height:36px;width:auto;margin-bottom:48px;}
  .code{
    font-family:'Fraunces',serif;
    font-size:clamp(4rem,15vw,7rem);
    line-height:1;
    color:var(--rust);
    margin-bottom:16px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:clamp(1.5rem,4vw,2rem);
    margin-bottom:12px;
  }
  p{
    font-size:15px;
    opacity:0.75;
    max-width:360px;
    line-height:1.6;
    margin-bottom:32px;
  }
  a.btn{
    background:var(--rust);
    color:var(--cream);
    text-decoration:none;
    padding:12px 28px;
    border-radius:9999px;
    font-size:14px;
    transition:background .2s ease;
  }
  a.btn:hover{background:var(--rust-dark);}
</style>
</head>
<body>
  <img class="logo" src="images/logo-rust.webp" alt="Carmela">
  <p class="code">404</p>

</body>
</html>
